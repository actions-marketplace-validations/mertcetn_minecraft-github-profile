name: 'Minecraft GitHub Profile Card'
description: 'Generate an authentic animated Minecraft-themed contribution card for your GitHub profile'
author: 'mertcetn'

branding:
  icon: 'grid'
  color: 'green'

inputs:
  github_token:
    description: 'GitHub token for fetching contribution data and deploying assets'
    required: false
    default: ${{ github.token }}
  github_username:
    description: 'GitHub username to generate contributions for (defaults to repository owner)'
    required: false
    default: ${{ github.repository_owner }}
  start_year:
    description: 'Start year for contributions history'
    required: false
    default: '2020'
  output_branch:
    description: 'Branch to deploy generated card assets'
    required: false
    default: 'output'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci

    - name: Generate Minecraft Profile Card
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        GH_USERNAME: ${{ inputs.github_username }}
        START_YEAR: ${{ inputs.start_year }}
      run: node scripts/render-card.js

    - name: Deploy assets to output branch
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        # 1. Back up generated assets from action directory
        mkdir -p /tmp/minecraft-assets
        cp "${{ github.action_path }}/assets/source/generated/"*.gif "${{ github.action_path }}/assets/source/generated/"*.png /tmp/minecraft-assets/ 2>/dev/null || true

        # 2. Switch to orphan output branch in calling repository
        git checkout --orphan ${{ inputs.output_branch }}
        git rm -rf .

        # 3. Restore generated assets into output branch
        mkdir -p assets/source/generated
        cp /tmp/minecraft-assets/* assets/source/generated/ 2>/dev/null || true
        cp /tmp/minecraft-assets/* . 2>/dev/null || true
        git add -f *.gif *.png assets/source/generated/*.gif assets/source/generated/*.png 2>/dev/null || true

        if git diff --staged --quiet; then
          echo "No changes detected in assets."
        else
          git commit -m "chore(assets): update minecraft contribution assets [skip ci]"
          git push origin ${{ inputs.output_branch }} --force
        fi
